name: Bug Report
description: "Stable Google Chrome is the priority. Beta, Dev, and Canary regressions are welcome. Questions, support requests, and unsupported Chromium forks are out of scope."
title: "[Bug] "
body:
  - type: checkboxes
    id: ensure
    attributes:
      label: Verification Steps
      description: Reports that do not satisfy these requirements may be closed without further discussion.
      options:
        - label: I have carefully read the [INI configuration file](https://github.com/Bush2021/chrome_plus/blob/main/src/chrome%2B%2B.ini) and understand the relevant options.
          required: true
        - label: I identified my Chrome channel. For a Beta, Dev, or Canary report, I included a comparison with the latest Stable release or explained why I could not test it.
          required: true
        - label: I am using the latest Chrome++ release.
          required: true
        - label: I reproduced the problem with the simplest configuration that still triggers it.
          required: true
        - label: I reproduced the problem in a clean environment, with extensions disabled and unrelated tools, injectors, overlays, launchers, and UI modifiers ruled out.
          required: true
        - label: I checked for a regression by testing an older Chrome++ release or Chrome build, or explained why I could not test older versions.
          required: true
        - label: I understand unsupported Chromium forks, questions, support requests, and reports missing required information may be closed.
          required: true
        - label: I make sure to describe the problem in English.
          required: true
  - type: dropdown
    id: chrome_channel
    attributes:
      label: Chrome Channel
      description: Stable Chrome is the primary support target. Beta, Dev, and Canary regression reports are also welcome.
      options:
        - Stable
        - Beta
        - Dev
        - Canary
    validations:
      required: true
  - type: textarea
    id: version_info
    attributes:
      label: Version Information
      description: Provide a screenshot of `chrome://version/`, and include your Windows version and the Chrome++ version.
    validations:
      required: true
  - type: textarea
    id: regression_check
    attributes:
      label: Regression Check
      description: |
        State whether the problem began after a Chrome++ update or a Chrome update. Include the versions tested and the last working and first affected versions, if known.
        For Beta, Dev, or Canary regressions, an older Chrome build can help identify where the problem started. If it never worked or you could not test older versions, say so and explain.
      placeholder: |
        Chrome++ versions tested and results:
        Chrome versions/channels tested and results:
        Last working / first affected versions:
        Notes: never worked for me / could not test older versions (explain why)
    validations:
      required: true
  - type: textarea
    id: configuration
    attributes:
      render: yaml
      label: Minimal Configuration File
      description: Paste the simplest `chrome++.ini` content that still reproduces the problem. Remove unrelated options and comments instead of pasting the full default file.
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: |
        Use the following format:
        1. Steps to reproduce
        2. Expected behavior
        3. Actual behavior
        4. What I already ruled out
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: Attachments
      description: |
        Attach files that make the report verifiable.
        - UI, gesture, tab, and interaction bugs must include a screen recording.
        - Startup failures and crashes must include logs, Crashpad dumps, or comparable diagnostics.
    validations:
      required: true
